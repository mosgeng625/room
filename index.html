<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LiteChat 公共聊天室</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      color: #111827;
      user-select: none;
    }

    .app {
      max-width: 1180px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #f1f5f9;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
      box-shadow: 0 0 30px rgba(15, 23, 42, 0.08);
    }

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.18);
      z-index: 2;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .status {
      margin-top: 3px;
      font-size: 12px;
      color: #bfdbfe;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .top-avatar {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .top-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nickname-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 8px 13px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 14px;
      transition: all 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn.danger {
      background: #ef4444;
      color: white;
    }

    .btn.ghost {
      background: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn.small {
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
    }

    .chat {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .side {
      width: 280px;
      border-left: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.94);
      padding: 16px;
      overflow-y: auto;
    }

    .side h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .side p {
      line-height: 1.6;
      font-size: 13px;
      color: #64748b;
    }

    .profile-card {
      padding: 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .selection-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      z-index: 1;
    }

    .selection-left {
      font-size: 14px;
      color: #334155;
      font-weight: 700;
    }

    .selection-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.08), transparent 32%),
        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.08), transparent 30%),
        #f1f5f9;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 18px;
      position: relative;
      cursor: default;
    }

    .msg-row.me {
      flex-direction: row-reverse;
    }

    .msg-row.selected .bubble {
      outline: 3px solid rgba(37, 99, 235, 0.25);
    }

    .select-dot {
      display: none;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 2px solid #94a3b8;
      background: white;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .select-mode .select-dot {
      display: flex;
    }

    .msg-row.selected .select-dot {
      background: #2563eb;
      border-color: #2563eb;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 800;
      color: white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar.me-avatar {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .avatar.other-avatar {
      background: linear-gradient(135deg, #475569, #0f172a);
    }

    .msg-stack {
      max-width: 70%;
      display: flex;
      flex-direction: column;
    }

    .msg-row.me .msg-stack {
      align-items: flex-end;
    }

    .msg-row.other .msg-stack {
      align-items: flex-start;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 12px;
      color: #64748b;
    }

    .msg-row.me .meta {
      flex-direction: row-reverse;
    }

    .role-badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .role-badge.me {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .role-badge.other {
      background: #e2e8f0;
      color: #334155;
    }

    .sender-name {
      font-weight: 700;
      color: #334155;
    }

    .time {
      color: #94a3b8;
    }

    .bubble {
      position: relative;
      padding: 11px 13px;
      border-radius: 16px;
      word-break: break-word;
      line-height: 1.55;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      max-width: 100%;
    }

    .bubble.me-bubble {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble.other-bubble {
      background: white;
      color: #0f172a;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 5px;
    }

    .bubble.me-bubble::after {
      content: "";
      position: absolute;
      right: -6px;
      bottom: 6px;
      border-left: 8px solid #3b82f6;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .bubble.other-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 6px;
      border-right: 8px solid white;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .content {
      font-size: 15px;
      white-space: pre-wrap;
      user-select: text;
    }

    .quote {
      border-left: 3px solid #94a3b8;
      background: rgba(148, 163, 184, 0.18);
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 12px;
      margin-bottom: 8px;
      color: #475569;
      max-width: 260px;
    }

    .me-bubble .quote {
      background: rgba(255, 255, 255, 0.18);
      color: #e0f2fe;
      border-left-color: #bfdbfe;
    }

    .chat-img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 13px;
      display: block;
      margin-top: 4px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .recalled {
      color: #64748b;
      font-style: italic;
      font-size: 14px;
    }

    .me-bubble .recalled {
      color: #dbeafe;
    }

    .composer {
      border-top: 1px solid #e5e7eb;
      padding: 13px;
      background: rgba(255, 255, 255, 0.96);
    }

    .quote-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 9px;
      font-size: 13px;
      color: #475569;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      background: #f8fafc;
      user-select: text;
    }

    textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .emoji-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .emoji-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .emoji-item:hover {
      transform: scale(1.04);
    }

    .nickname-page {
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }

    .nickname-card {
      width: 390px;
      background: white;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.16);
    }

    .nickname-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .nickname-card p {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 14px;
    }

    .nickname-card input[type="text"] {
      width: 100%;
      height: 45px;
      border-radius: 13px;
      border: 1px solid #cbd5e1;
      padding: 0 13px;
      font-size: 15px;
      outline: none;
      margin-bottom: 13px;
    }

    .avatar-setup {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #f8fafc;
      margin-bottom: 13px;
    }

    .setup-avatar-preview {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .setup-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.5;
    }

    .sheet-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 99;
    }

    .sheet {
      width: min(420px, calc(100% - 24px));
      background: white;
      border-radius: 22px 22px 0 0;
      padding: 14px;
      box-shadow: 0 -12px 36px rgba(15, 23, 42, 0.18);
      animation: sheetUp 0.16s ease-out;
    }

    @keyframes sheetUp {
      from {
        transform: translateY(18px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-title {
      font-weight: 800;
      color: #0f172a;
      padding: 8px 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }

    .sheet-btn {
      width: 100%;
      border: none;
      background: white;
      padding: 14px 10px;
      text-align: left;
      font-size: 15px;
      color: #0f172a;
      border-radius: 12px;
      cursor: pointer;
    }

    .sheet-btn:hover {
      background: #f1f5f9;
    }

    .sheet-btn.danger {
      color: #ef4444;
      font-weight: 700;
    }

    .sheet-btn.cancel {
      text-align: center;
      background: #f1f5f9;
      margin-top: 8px;
      color: #475569;
    }

    @media (max-width: 760px) {
      .side {
        display: none;
      }

      .msg-stack {
        max-width: 78%;
      }

      .topbar {
        padding: 0 12px;
      }

      .chat-img {
        max-width: 190px;
        max-height: 190px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 12px;
      }

      .user {
        gap: 6px;
      }

      .nickname-pill {
        display: none;
      }

      .selection-bar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="nicknamePage" class="nickname-page">
    <div class="nickname-card">
      <h1>进入 LiteChat</h1>
      <p>不用注册，输入昵称并选择头像即可进入公共聊天室。</p>

      <input id="nicknameInput" type="text" placeholder="请输入昵称，例如：小杨" maxlength="24" />

      <div class="avatar-setup">
        <div id="setupAvatarPreview" class="setup-avatar-preview">?</div>
        <div>
          <button class="btn secondary" onclick="document.getElementById('avatarSetupInput').click()">选择头像</button>
          <input id="avatarSetupInput" type="file" accept="image/*" style="display:none" onchange="uploadAvatarFromSetup()" />
          <div class="hint">头像会保存在当前浏览器，并上传到 Supabase Storage。</div>
        </div>
      </div>

      <button class="btn" style="width:100%" onclick="saveNickname()">进入聊天室</button>
    </div>
  </div>

  <div id="app" class="app" style="display:none">
    <header class="topbar">
      <div>
        <div class="brand">LiteChat 公共聊天室</div>
        <div class="status" id="statusText">连接中...</div>
      </div>

      <div class="user">
        <div id="topAvatar" class="top-avatar"></div>
        <span id="nicknameText" class="nickname-pill"></span>
        <button class="btn small secondary" onclick="changeNickname()">改昵称</button>
        <button class="btn small secondary" onclick="document.getElementById('avatarChangeInput').click()">换头像</button>
        <input id="avatarChangeInput" type="file" accept="image/*" style="display:none" onchange="uploadAvatarFromTop()" />
      </div>
    </header>

    <div class="chat">
      <main class="main">
        <div id="selectionBar" class="selection-bar">
          <div class="selection-left" id="selectionCount">已选择 0 条</div>
          <div class="selection-actions">
            <button class="btn small secondary" onclick="selectAllVisibleMessages()">全选</button>
            <button class="btn small danger" onclick="deleteSelectedMessages()">删除选中</button>
            <button class="btn small ghost" onclick="exitSelectMode()">取消</button>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="composer">
          <div id="quoteBar" class="quote-bar">
            <span id="quoteText"></span>
            <button class="btn small secondary" onclick="cancelQuote()">取消引用</button>
          </div>

          <div class="input-row">
            <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
            <input id="imageInput" type="file" accept="image/*" style="display:none" onchange="uploadImage()" />
            <button class="btn secondary" onclick="document.getElementById('imageInput').click()">图片</button>
            <button class="btn" onclick="sendText()">发送</button>
          </div>
        </div>
      </main>

      <aside class="side">
        <div class="profile-card">
          <div class="profile-row">
            <div id="sideAvatar" class="profile-avatar"></div>
            <div>
              <strong id="sideNickname"></strong>
              <div class="hint">当前本地身份</div>
            </div>
          </div>
          <button class="btn small secondary" onclick="document.getElementById('avatarChangeInput').click()">更换头像</button>
        </div>

        <h3>我的表情</h3>
        <p>点击图片消息，长按后选择“保存为表情”。</p>
        <div id="emojiList" class="emoji-list"></div>
      </aside>
    </div>
  </div>

  <div id="actionSheetMask" class="sheet-mask" onclick="closeActionSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div id="sheetTitle" class="sheet-title">消息操作</div>
      <div id="sheetActions"></div>
      <button class="sheet-btn cancel" onclick="closeActionSheet()">取消</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wjhlzzjoczmxefrokmaz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dp1dtmMyMFLSCWT0kwCFrg_j5n-EF80';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROOM = 'public';

    let nickname = localStorage.getItem('litechat_nickname') || '';
    let avatarUrl = localStorage.getItem('litechat_avatar_url') || '';
    let clientId = localStorage.getItem('litechat_client_id') || '';
    let quoteMessage = null;
    let messagesCache = [];
    let subscribed = false;

    let longPressTimer = null;
    let justLongPressed = false;
    let currentActionMessageId = null;

    let selectMode = false;
    let selectedIds = new Set();

    if (!clientId) {
      clientId = crypto.randomUUID();
      localStorage.setItem('litechat_client_id', clientId);
    }

    function $(id) {
      return document.getElementById(id);
    }

    function getHiddenIds() {
      return JSON.parse(localStorage.getItem('litechat_hidden_ids') || '[]');
    }

    function setHiddenIds(ids) {
      localStorage.setItem('litechat_hidden_ids', JSON.stringify(ids));
    }

    function getEmojis() {
      return JSON.parse(localStorage.getItem('litechat_emojis') || '[]');
    }

    function setEmojis(list) {
      localStorage.setItem('litechat_emojis', JSON.stringify(list));
    }

    function showApp() {
      $('nicknamePage').style.display = 'none';
      $('app').style.display = 'flex';

      updateCurrentUserUI();
      loadMessages();
      renderEmojis();

      if (!subscribed) {
        subscribeMessages();
        subscribed = true;
      }
    }

    function showNicknamePage() {
      $('nicknamePage').style.display = 'flex';
      $('app').style.display = 'none';
      $('nicknameInput').value = nickname || '';
      renderSetupAvatar();
    }

    function saveNickname() {
      const value = $('nicknameInput').value.trim();

      if (!value) {
        alert('请先输入昵称');
        return;
      }

      nickname = value.slice(0, 24);
      localStorage.setItem('litechat_nickname', nickname);

      showApp();
    }

    function changeNickname() {
      const value = prompt('请输入新昵称', nickname);

      if (!value || !value.trim()) return;

      nickname = value.trim().slice(0, 24);
      localStorage.setItem('litechat_nickname', nickname);
      updateCurrentUserUI();
    }

    function updateCurrentUserUI() {
      $('nicknameText').textContent = nickname;
      $('sideNickname').textContent = nickname;

      renderAvatarBox($('topAvatar'), nickname, avatarUrl);
      renderAvatarBox($('sideAvatar'), nickname, avatarUrl);
    }

    function renderSetupAvatar() {
      renderAvatarBox($('setupAvatarPreview'), nickname || $('nicknameInput').value || '?', avatarUrl);
    }

    $('nicknameInput').addEventListener('input', renderSetupAvatar);

    async function uploadAvatarFromSetup() {
      const input = $('avatarSetupInput');
      const file = input.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'avatars');

      if (url) {
        avatarUrl = url;
        localStorage.setItem('litechat_avatar_url', avatarUrl);
        renderSetupAvatar();
      }

      input.value = '';
    }

    async function uploadAvatarFromTop() {
      const input = $('avatarChangeInput');
      const file = input.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'avatars');

      if (url) {
        avatarUrl = url;
        localStorage.setItem('litechat_avatar_url', avatarUrl);
        updateCurrentUserUI();
      }

      input.value = '';
    }

    async function uploadFileToStorage(file, folder) {
      try {
        const ext = file.name.split('.').pop() || 'png';
        const path = `${folder}/${Date.now()}-${clientId}-${Math.random().toString(16).slice(2)}.${ext}`;

        const { error } = await client.storage
          .from('chat-images')
          .upload(path, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (error) {
          console.error(error);
          alert('上传失败：' + error.message);
          return '';
        }

        const { data } = client.storage
          .from('chat-images')
          .getPublicUrl(path);

        return data.publicUrl;
      } catch (err) {
        console.error(err);
        alert('上传失败：' + err.message);
        return '';
      }
    }

    async function loadMessages() {
      const { data, error } = await client
        .from('messages')
        .select('*')
        .eq('room', ROOM)
        .order('created_at', { ascending: true })
        .limit(300);

      if (error) {
        console.error(error);
        $('statusText').textContent = '连接失败：' + error.message;
        return;
      }

      $('statusText').textContent = '已连接公共频道';
      messagesCache = data || [];
      renderMessages();
    }

    function subscribeMessages() {
      client
        .channel('litechat-public-room')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'messages',
            filter: 'room=eq.public'
          },
          function () {
            loadMessages();
          }
        )
        .subscribe(function (status) {
          if (status === 'SUBSCRIBED') {
            $('statusText').textContent = '已连接公共频道';
          }
        });
    }

    function getVisibleMessages() {
      const hiddenIds = getHiddenIds();

      return messagesCache.filter(function (m) {
        return !hiddenIds.includes(m.id);
      });
    }

    function renderMessages() {
      const box = $('messages');
      const visibleMessages = getVisibleMessages();

      if (selectMode) {
        box.classList.add('select-mode');
      } else {
        box.classList.remove('select-mode');
      }

      box.innerHTML = visibleMessages.map(function (m) {
        const isMe = m.sender_client_id === clientId;
        const time = new Date(m.created_at).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });

        let body = '';

        if (m.recalled) {
          body = '<div class="recalled">该消息已撤回</div>';
        } else if (m.type === 'text') {
          body = '<div class="content">' + escapeHtml(m.content || '') + '</div>';
        } else if (m.type === 'image' || m.type === 'emoji') {
          body = '<img class="chat-img" src="' + escapeAttr(m.image_url || '') + '" onclick="openImageById(\'' + m.id + '\', event)" />';
        }

        const quote = m.quote_preview
          ? '<div class="quote">引用 ' + escapeHtml(m.quote_sender_name || '') + '：' + escapeHtml(m.quote_preview || '') + '</div>'
          : '';

        const rowClass = isMe ? 'me' : 'other';
        const bubbleClass = isMe ? 'me-bubble' : 'other-bubble';
        const avatarClass = isMe ? 'me-avatar' : 'other-avatar';
        const roleText = isMe ? '我' : '对方';
        const selectedClass = selectedIds.has(m.id) ? ' selected' : '';

        const avatarHtml = renderMessageAvatarHtml(
          m.sender_name,
          m.sender_avatar_url,
          avatarClass
        );

        return ''
          + '<div class="msg-row ' + rowClass + selectedClass + '" '
          + 'onmousedown="startLongPress(event, \'' + m.id + '\')" '
          + 'onmouseup="cancelLongPress()" '
          + 'onmouseleave="cancelLongPress()" '
          + 'ontouchstart="startLongPress(event, \'' + m.id + '\')" '
          + 'ontouchend="cancelLongPress()" '
          + 'oncontextmenu="openActionSheet(\'' + m.id + '\'); return false;" '
          + 'onclick="handleMessageClick(\'' + m.id + '\', event)">'
          + '<div class="select-dot">' + (selectedIds.has(m.id) ? '✓' : '') + '</div>'
          + avatarHtml
          + '<div class="msg-stack">'
          + '<div class="meta">'
          + '<span class="role-badge ' + rowClass + '">' + roleText + '</span>'
          + '<span class="sender-name">' + escapeHtml(m.sender_name || '') + '</span>'
          + '<span class="time">' + time + '</span>'
          + '</div>'
          + '<div class="bubble ' + bubbleClass + '">'
          + quote
          + body
          + '</div>'
          + '</div>'
          + '</div>';
      }).join('');

      updateSelectionBar();
      box.scrollTop = box.scrollHeight;
    }

    function startLongPress(event, id) {
      if (selectMode) return;

      cancelLongPress();

      longPressTimer = setTimeout(function () {
        justLongPressed = true;
        openActionSheet(id);

        if (navigator.vibrate) {
          navigator.vibrate(35);
        }
      }, 600);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function handleMessageClick(id, event) {
      if (justLongPressed) {
        justLongPressed = false;
        return;
      }

      if (selectMode) {
        toggleSelectedMessage(id);
      }
    }

    function openActionSheet(id) {
      cancelLongPress();

      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (!msg) return;

      currentActionMessageId = id;

      const isMe = msg.sender_client_id === clientId;
      const canSaveEmoji = !msg.recalled && (msg.type === 'image' || msg.type === 'emoji');

      $('sheetTitle').textContent = '选择操作：' + getPreview(msg);

      let html = '';

      html += '<button class="sheet-btn" onclick="quoteCurrentMessage()">引用这条消息</button>';
      html += '<button class="sheet-btn" onclick="enterSelectModeFromCurrent()">多选删除</button>';
      html += '<button class="sheet-btn danger" onclick="deleteCurrentMessage()">删除这条消息</button>';
      html += '<button class="sheet-btn danger" onclick="deleteAllVisibleMessages()">删除全部可见消息</button>';

      if (canSaveEmoji) {
        html += '<button class="sheet-btn" onclick="saveCurrentImageAsEmoji()">保存为表情</button>';
      }

      if (isMe && !msg.recalled) {
        html += '<button class="sheet-btn danger" onclick="recallCurrentMessage()">撤回这条消息</button>';
      }

      $('sheetActions').innerHTML = html;
      $('actionSheetMask').style.display = 'flex';
    }

    function closeActionSheet() {
      $('actionSheetMask').style.display = 'none';
      currentActionMessageId = null;
    }

    function quoteCurrentMessage() {
      if (!currentActionMessageId) return;

      quoteById(currentActionMessageId);
      closeActionSheet();
    }

    function deleteCurrentMessage() {
      if (!currentActionMessageId) return;

      hideMessage(currentActionMessageId);
      closeActionSheet();
    }

    function enterSelectModeFromCurrent() {
      if (!currentActionMessageId) return;

      selectMode = true;
      selectedIds = new Set([currentActionMessageId]);

      closeActionSheet();
      renderMessages();
    }

    function deleteAllVisibleMessages() {
      const visibleMessages = getVisibleMessages();

      if (!visibleMessages.length) {
        closeActionSheet();
        return;
      }

      if (!confirm('确定删除当前浏览器里所有可见聊天记录吗？此操作只影响当前浏览器。')) return;

      const hiddenIds = getHiddenIds();
      const merged = new Set(hiddenIds);

      visibleMessages.forEach(function (m) {
        merged.add(m.id);
      });

      setHiddenIds(Array.from(merged));
      closeActionSheet();
      exitSelectMode();
      renderMessages();
    }

    function saveCurrentImageAsEmoji() {
      if (!currentActionMessageId) return;

      const msg = messagesCache.find(function (m) {
        return m.id === currentActionMessageId;
      });

      if (msg && msg.image_url) {
        saveEmoji(msg.image_url);
      }

      closeActionSheet();
    }

    async function recallCurrentMessage() {
      if (!currentActionMessageId) return;

      const id = currentActionMessageId;

      closeActionSheet();
      await recallMessage(id);
    }

    function toggleSelectedMessage(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }

      renderMessages();
    }

    function selectAllVisibleMessages() {
      selectedIds = new Set(getVisibleMessages().map(function (m) {
        return m.id;
      }));

      renderMessages();
    }

    function deleteSelectedMessages() {
      if (!selectedIds.size) {
        alert('请先选择消息');
        return;
      }

      if (!confirm('确定删除选中的 ' + selectedIds.size + ' 条消息吗？此操作只影响当前浏览器。')) return;

      const hiddenIds = getHiddenIds();
      const merged = new Set(hiddenIds);

      selectedIds.forEach(function (id) {
        merged.add(id);
      });

      setHiddenIds(Array.from(merged));
      exitSelectMode();
      renderMessages();
    }

    function exitSelectMode() {
      selectMode = false;
      selectedIds = new Set();
      updateSelectionBar();
      renderMessages();
    }

    function updateSelectionBar() {
      if (selectMode) {
        $('selectionBar').style.display = 'flex';
        $('selectionCount').textContent = '已选择 ' + selectedIds.size + ' 条';
      } else {
        $('selectionBar').style.display = 'none';
        $('selectionCount').textContent = '已选择 0 条';
      }
    }

    async function sendText() {
      const input = $('messageInput');
      const text = input.value.trim();

      if (!text) return;

      await sendMessage({
        type: 'text',
        content: text,
        image_url: null
      });

      input.value = '';
    }

    async function sendMessage(payload) {
      if (!nickname) {
        alert('请先设置昵称');
        showNicknamePage();
        return;
      }

      const row = {
        room: ROOM,
        sender_name: nickname,
        sender_client_id: clientId,
        sender_avatar_url: avatarUrl || null,
        type: payload.type,
        content: payload.content,
        image_url: payload.image_url,
        quote_id: quoteMessage ? quoteMessage.id : null,
        quote_sender_name: quoteMessage ? quoteMessage.sender_name : null,
        quote_preview: quoteMessage ? getPreview(quoteMessage) : null
      };

      const { error } = await client.from('messages').insert(row);

      if (error) {
        console.error(error);
        alert('发送失败：' + error.message);
        return;
      }

      cancelQuote();
      loadMessages();
    }

    async function uploadImage() {
      const fileInput = $('imageInput');
      const file = fileInput.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'public');

      if (!url) {
        fileInput.value = '';
        return;
      }

      await sendMessage({
        type: 'image',
        content: '[图片]',
        image_url: url
      });

      fileInput.value = '';
    }

    function openImageById(id, event) {
      if (event) {
        event.stopPropagation();
      }

      if (selectMode) {
        toggleSelectedMessage(id);
        return;
      }

      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (msg && msg.image_url) {
        window.open(msg.image_url, '_blank');
      }
    }

    function saveEmoji(url) {
      if (!url) return;

      const list = getEmojis();

      if (!list.includes(url)) {
        list.unshift(url);
        setEmojis(list.slice(0, 60));
      }

      renderEmojis();
    }

    function renderEmojis() {
      const list = getEmojis();

      $('emojiList').innerHTML = list.map(function (url) {
        return '<img class="emoji-item" src="' + escapeAttr(url) + '" onclick="sendEmoji(\'' + escapeAttr(url) + '\')" />';
      }).join('');
    }

    async function sendEmoji(url) {
      await sendMessage({
        type: 'emoji',
        content: '[表情]',
        image_url: url
      });
    }

    function quoteById(id) {
      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (!msg) return;

      quoteMessage = msg;
      $('quoteText').textContent = '引用 ' + msg.sender_name + '：' + getPreview(msg);
      $('quoteBar').style.display = 'flex';
      $('messageInput').focus();
    }

    function cancelQuote() {
      quoteMessage = null;
      $('quoteText').textContent = '';
      $('quoteBar').style.display = 'none';
    }

    async function recallMessage(id) {
      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (!msg) return;

      if (msg.sender_client_id !== clientId) {
        alert('只能撤回当前浏览器发送的消息');
        return;
      }

      const { error } = await client
        .from('messages')
        .update({
          recalled: true,
          content: null,
          image_url: null
        })
        .eq('id', id);

      if (error) {
        console.error(error);
        alert('撤回失败：' + error.message);
        return;
      }

      loadMessages();
    }

    function hideMessage(id) {
      const ids = getHiddenIds();

      if (!ids.includes(id)) {
        ids.push(id);
        setHiddenIds(ids);
      }

      renderMessages();
    }

    function getPreview(msg) {
      if (msg.recalled) return '该消息已撤回';
      if (msg.type === 'text') return (msg.content || '').slice(0, 40);
      if (msg.type === 'image') return '[图片]';
      if (msg.type === 'emoji') return '[表情]';
      return '[消息]';
    }

    function renderMessageAvatarHtml(name, url, avatarClass) {
      if (url) {
        return '<div class="avatar ' + avatarClass + '"><img src="' + escapeAttr(url) + '" /></div>';
      }

      return '<div class="avatar ' + avatarClass + '">' + escapeHtml(getAvatarText(name)) + '</div>';
    }

    function renderAvatarBox(el, name, url) {
      if (!el) return;

      if (url) {
        el.innerHTML = '<img src="' + escapeAttr(url) + '" />';
      } else {
        el.textContent = getAvatarText(name);
      }
    }

    function getAvatarText(name) {
      if (!name) return '?';

      const clean = String(name).trim();

      if (!clean) return '?';

      const first = clean[0];
      const second = clean[1];

      if (/[\u4e00-\u9fa5]/.test(first)) {
        return first;
      }

      if (second && /^[a-zA-Z0-9]$/.test(second)) {
        return (first + second).toUpperCase();
      }

      return first.toUpperCase();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    $('messageInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    });

    if (nickname) {
      showApp();
    } else {
      showNicknamePage();
    }
  </script>
</body>
</html>
