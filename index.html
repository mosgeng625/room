<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LiteChat 公共聊天室</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      color: #111827;
    }

    .app {
      max-width: 1180px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #f1f5f9;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
      box-shadow: 0 0 30px rgba(15, 23, 42, 0.08);
    }

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.18);
      z-index: 2;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .status {
      margin-top: 3px;
      font-size: 12px;
      color: #bfdbfe;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .top-avatar {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .top-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nickname-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 8px 13px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 14px;
      transition: all 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn.danger {
      background: #ef4444;
      color: white;
    }

    .btn.small {
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
    }

    .chat {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .side {
      width: 280px;
      border-left: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.94);
      padding: 16px;
      overflow-y: auto;
    }

    .side h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .side p {
      line-height: 1.6;
      font-size: 13px;
      color: #64748b;
    }

    .profile-card {
      padding: 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.08), transparent 32%),
        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.08), transparent 30%),
        #f1f5f9;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 18px;
    }

    .msg-row.me {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 800;
      color: white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar.me-avatar {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .avatar.other-avatar {
      background: linear-gradient(135deg, #475569, #0f172a);
    }

    .msg-stack {
      max-width: 70%;
      display: flex;
      flex-direction: column;
    }

    .msg-row.me .msg-stack {
      align-items: flex-end;
    }

    .msg-row.other .msg-stack {
      align-items: flex-start;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 12px;
      color: #64748b;
    }

    .msg-row.me .meta {
      flex-direction: row-reverse;
    }

    .role-badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .role-badge.me {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .role-badge.other {
      background: #e2e8f0;
      color: #334155;
    }

    .sender-name {
      font-weight: 700;
      color: #334155;
    }

    .time {
      color: #94a3b8;
    }

    .bubble {
      position: relative;
      padding: 11px 13px;
      border-radius: 16px;
      word-break: break-word;
      line-height: 1.55;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .bubble.me-bubble {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble.other-bubble {
      background: white;
      color: #0f172a;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 5px;
    }

    .bubble.me-bubble::after {
      content: "";
      position: absolute;
      right: -6px;
      bottom: 6px;
      border-left: 8px solid #3b82f6;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .bubble.other-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 6px;
      border-right: 8px solid white;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .content {
      font-size: 15px;
      white-space: pre-wrap;
    }

    .quote {
      border-left: 3px solid #94a3b8;
      background: rgba(148, 163, 184, 0.18);
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 12px;
      margin-bottom: 8px;
      color: #475569;
    }

    .me-bubble .quote {
      background: rgba(255, 255, 255, 0.18);
      color: #e0f2fe;
      border-left-color: #bfdbfe;
    }

    .chat-img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 13px;
      display: block;
      margin-top: 4px;
      cursor: pointer;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      opacity: 0.45;
      transition: opacity 0.15s ease;
    }

    .msg-stack:hover .actions {
      opacity: 1;
    }

    .msg-row.me .actions {
      justify-content: flex-end;
    }

    .recalled {
      color: #64748b;
      font-style: italic;
      font-size: 14px;
    }

    .me-bubble .recalled {
      color: #dbeafe;
    }

    .composer {
      border-top: 1px solid #e5e7eb;
      padding: 13px;
      background: rgba(255, 255, 255, 0.96);
    }

    .quote-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 9px;
      font-size: 13px;
      color: #475569;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      background: #f8fafc;
    }

    textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .emoji-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .emoji-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .emoji-item:hover {
      transform: scale(1.04);
    }

    .nickname-page {
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }

    .nickname-card {
      width: 390px;
      background: white;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.16);
    }

    .nickname-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .nickname-card p {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 14px;
    }

    .nickname-card input[type="text"] {
      width: 100%;
      height: 45px;
      border-radius: 13px;
      border: 1px solid #cbd5e1;
      padding: 0 13px;
      font-size: 15px;
      outline: none;
      margin-bottom: 13px;
    }

    .avatar-setup {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #f8fafc;
      margin-bottom: 13px;
    }

    .setup-avatar-preview {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .setup-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .side {
        display: none;
      }

      .msg-stack {
        max-width: 78%;
      }

      .topbar {
        padding: 0 12px;
      }

      .chat-img {
        max-width: 190px;
        max-height: 190px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="nicknamePage" class="nickname-page">
    <div class="nickname-card">
      <h1>进入 LiteChat</h1>
      <p>不用注册，输入昵称并选择头像即可进入公共聊天室。</p>

      <input id="nicknameInput" type="text" placeholder="请输入昵称，例如：小杨" maxlength="24" />

      <div class="avatar-setup">
        <div id="setupAvatarPreview" class="setup-avatar-preview">?</div>
        <div>
          <button class="btn secondary" onclick="document.getElementById('avatarSetupInput').click()">选择头像</button>
          <input id="avatarSetupInput" type="file" accept="image/*" style="display:none" onchange="uploadAvatarFromSetup()" />
          <div class="hint">头像会保存在当前浏览器，并上传到 Supabase Storage。</div>
        </div>
      </div>

      <button class="btn" style="width:100%" onclick="saveNickname()">进入聊天室</button>
    </div>
  </div>

  <div id="app" class="app" style="display:none">
    <header class="topbar">
      <div>
        <div class="brand">LiteChat 公共聊天室</div>
        <div class="status" id="statusText">连接中...</div>
      </div>

      <div class="user">
        <div id="topAvatar" class="top-avatar"></div>
        <span id="nicknameText" class="nickname-pill"></span>
        <button class="btn small secondary" onclick="changeNickname()">改昵称</button>
        <button class="btn small secondary" onclick="document.getElementById('avatarChangeInput').click()">换头像</button>
        <input id="avatarChangeInput" type="file" accept="image/*" style="display:none" onchange="uploadAvatarFromTop()" />
      </div>
    </header>

    <div class="chat">
      <main class="main">
        <div id="messages" class="messages"></div>

        <div class="composer">
          <div id="quoteBar" class="quote-bar">
            <span id="quoteText"></span>
            <button class="btn small secondary" onclick="cancelQuote()">取消引用</button>
          </div>

          <div class="input-row">
            <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
            <input id="imageInput" type="file" accept="image/*" style="display:none" onchange="uploadImage()" />
            <button class="btn secondary" onclick="document.getElementById('imageInput').click()">图片</button>
            <button class="btn" onclick="sendText()">发送</button>
          </div>
        </div>
      </main>

      <aside class="side">
        <div class="profile-card">
          <div class="profile-row">
            <div id="sideAvatar" class="profile-avatar"></div>
            <div>
              <strong id="sideNickname"></strong>
              <div class="hint">当前本地身份</div>
            </div>
          </div>
          <button class="btn small secondary" onclick="document.getElementById('avatarChangeInput').click()">更换头像</button>
        </div>

        <h3>我的表情</h3>
        <p>点击聊天图片下方“存表情”，会保存到当前浏览器。</p>
        <button class="btn small danger" onclick="clearLocalHidden()">清空本地删除记录</button>
        <div id="emojiList" class="emoji-list"></div>
      </aside>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wjhlzzjoczmxefrokmaz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dp1dtmMyMFLSCWT0kwCFrg_j5n-EF80';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROOM = 'public';

    let nickname = localStorage.getItem('litechat_nickname') || '';
    let avatarUrl = localStorage.getItem('litechat_avatar_url') || '';
    let clientId = localStorage.getItem('litechat_client_id') || '';
    let quoteMessage = null;
    let messagesCache = [];
    let subscribed = false;

    if (!clientId) {
      clientId = crypto.randomUUID();
      localStorage.setItem('litechat_client_id', clientId);
    }

    function $(id) {
      return document.getElementById(id);
    }

    function getHiddenIds() {
      return JSON.parse(localStorage.getItem('litechat_hidden_ids') || '[]');
    }

    function setHiddenIds(ids) {
      localStorage.setItem('litechat_hidden_ids', JSON.stringify(ids));
    }

    function getEmojis() {
      return JSON.parse(localStorage.getItem('litechat_emojis') || '[]');
    }

    function setEmojis(list) {
      localStorage.setItem('litechat_emojis', JSON.stringify(list));
    }

    function showApp() {
      $('nicknamePage').style.display = 'none';
      $('app').style.display = 'flex';

      updateCurrentUserUI();
      loadMessages();
      renderEmojis();

      if (!subscribed) {
        subscribeMessages();
        subscribed = true;
      }
    }

    function showNicknamePage() {
      $('nicknamePage').style.display = 'flex';
      $('app').style.display = 'none';
      $('nicknameInput').value = nickname || '';
      renderSetupAvatar();
    }

    function saveNickname() {
      const value = $('nicknameInput').value.trim();

      if (!value) {
        alert('请先输入昵称');
        return;
      }

      nickname = value.slice(0, 24);
      localStorage.setItem('litechat_nickname', nickname);

      showApp();
    }

    function changeNickname() {
      const value = prompt('请输入新昵称', nickname);

      if (!value || !value.trim()) return;

      nickname = value.trim().slice(0, 24);
      localStorage.setItem('litechat_nickname', nickname);
      updateCurrentUserUI();
    }

    function updateCurrentUserUI() {
      $('nicknameText').textContent = nickname;
      $('sideNickname').textContent = nickname;

      renderAvatarBox($('topAvatar'), nickname, avatarUrl, true);
      renderAvatarBox($('sideAvatar'), nickname, avatarUrl, true);
    }

    function renderSetupAvatar() {
      renderAvatarBox($('setupAvatarPreview'), nickname || $('nicknameInput').value || '?', avatarUrl, true);
    }

    $('nicknameInput').addEventListener('input', renderSetupAvatar);

    async function uploadAvatarFromSetup() {
      const input = $('avatarSetupInput');
      const file = input.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'avatars');

      if (url) {
        avatarUrl = url;
        localStorage.setItem('litechat_avatar_url', avatarUrl);
        renderSetupAvatar();
      }

      input.value = '';
    }

    async function uploadAvatarFromTop() {
      const input = $('avatarChangeInput');
      const file = input.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'avatars');

      if (url) {
        avatarUrl = url;
        localStorage.setItem('litechat_avatar_url', avatarUrl);
        updateCurrentUserUI();
      }

      input.value = '';
    }

    async function uploadFileToStorage(file, folder) {
      try {
        const ext = file.name.split('.').pop() || 'png';
        const path = `${folder}/${Date.now()}-${clientId}-${Math.random().toString(16).slice(2)}.${ext}`;

        const { error } = await client.storage
          .from('chat-images')
          .upload(path, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (error) {
          console.error(error);
          alert('上传失败：' + error.message);
          return '';
        }

        const { data } = client.storage
          .from('chat-images')
          .getPublicUrl(path);

        return data.publicUrl;
      } catch (err) {
        console.error(err);
        alert('上传失败：' + err.message);
        return '';
      }
    }

    async function loadMessages() {
      const { data, error } = await client
        .from('messages')
        .select('*')
        .eq('room', ROOM)
        .order('created_at', { ascending: true })
        .limit(300);

      if (error) {
        console.error(error);
        $('statusText').textContent = '连接失败：' + error.message;
        return;
      }

      $('statusText').textContent = '已连接公共频道';
      messagesCache = data || [];
      renderMessages();
    }

    function subscribeMessages() {
      client
        .channel('litechat-public-room')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'messages',
            filter: 'room=eq.public'
          },
          function () {
            loadMessages();
          }
        )
        .subscribe(function (status) {
          if (status === 'SUBSCRIBED') {
            $('statusText').textContent = '已连接公共频道';
          }
        });
    }

    function renderMessages() {
      const box = $('messages');
      const hiddenIds = getHiddenIds();
      const visibleMessages = messagesCache.filter(function (m) {
        return !hiddenIds.includes(m.id);
      });

      box.innerHTML = visibleMessages.map(function (m) {
        const isMe = m.sender_client_id === clientId;
        const time = new Date(m.created_at).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });

        let body = '';

        if (m.recalled) {
          body = '<div class="recalled">该消息已撤回</div>';
        } else if (m.type === 'text') {
          body = '<div class="content">' + escapeHtml(m.content || '') + '</div>';
        } else if (m.type === 'image' || m.type === 'emoji') {
          body = '<img class="chat-img" src="' + escapeAttr(m.image_url || '') + '" onclick="window.open(\'' + escapeAttr(m.image_url || '') + '\', \'_blank\')" />';
        }

        const quote = m.quote_preview
          ? '<div class="quote">引用 ' + escapeHtml(m.quote_sender_name || '') + '：' + escapeHtml(m.quote_preview || '') + '</div>'
          : '';

        const imageActions = (!m.recalled && (m.type === 'image' || m.type === 'emoji'))
          ? '<button class="btn small secondary" onclick="saveEmoji(\'' + escapeAttr(m.image_url || '') + '\')">存表情</button>'
          : '';

        const recallAction = isMe && !m.recalled
          ? '<button class="btn small secondary" onclick="recallMessage(\'' + m.id + '\')">撤回</button>'
          : '';

        const rowClass = isMe ? 'me' : 'other';
        const bubbleClass = isMe ? 'me-bubble' : 'other-bubble';
        const avatarClass = isMe ? 'me-avatar' : 'other-avatar';
        const roleText = isMe ? '我' : '对方';

        const avatarHtml = renderMessageAvatarHtml(
          m.sender_name,
          m.sender_avatar_url,
          avatarClass
        );

        return ''
          + '<div class="msg-row ' + rowClass + '">'
          + avatarHtml
          + '<div class="msg-stack">'
          + '<div class="meta">'
          + '<span class="role-badge ' + rowClass + '">' + roleText + '</span>'
          + '<span class="sender-name">' + escapeHtml(m.sender_name || '') + '</span>'
          + '<span class="time">' + time + '</span>'
          + '</div>'
          + '<div class="bubble ' + bubbleClass + '">'
          + quote
          + body
          + '</div>'
          + '<div class="actions">'
          + '<button class="btn small secondary" onclick="quoteById(\'' + m.id + '\')">引用</button>'
          + imageActions
          + recallAction
          + '<button class="btn small danger" onclick="hideMessage(\'' + m.id + '\')">删除</button>'
          + '</div>'
          + '</div>'
          + '</div>';
      }).join('');

      box.scrollTop = box.scrollHeight;
    }

    async function sendText() {
      const input = $('messageInput');
      const text = input.value.trim();

      if (!text) return;

      await sendMessage({
        type: 'text',
        content: text,
        image_url: null
      });

      input.value = '';
    }

    async function sendMessage(payload) {
      if (!nickname) {
        alert('请先设置昵称');
        showNicknamePage();
        return;
      }

      const row = {
        room: ROOM,
        sender_name: nickname,
        sender_client_id: clientId,
        sender_avatar_url: avatarUrl || null,
        type: payload.type,
        content: payload.content,
        image_url: payload.image_url,
        quote_id: quoteMessage ? quoteMessage.id : null,
        quote_sender_name: quoteMessage ? quoteMessage.sender_name : null,
        quote_preview: quoteMessage ? getPreview(quoteMessage) : null
      };

      const { error } = await client.from('messages').insert(row);

      if (error) {
        console.error(error);
        alert('发送失败：' + error.message);
        return;
      }

      cancelQuote();
      loadMessages();
    }

    async function uploadImage() {
      const fileInput = $('imageInput');
      const file = fileInput.files[0];

      if (!file) return;

      const url = await uploadFileToStorage(file, 'public');

      if (!url) {
        fileInput.value = '';
        return;
      }

      await sendMessage({
        type: 'image',
        content: '[图片]',
        image_url: url
      });

      fileInput.value = '';
    }

    function saveEmoji(url) {
      if (!url) return;

      const list = getEmojis();

      if (!list.includes(url)) {
        list.unshift(url);
        setEmojis(list.slice(0, 60));
      }

      renderEmojis();
    }

    function renderEmojis() {
      const list = getEmojis();

      $('emojiList').innerHTML = list.map(function (url) {
        return '<img class="emoji-item" src="' + escapeAttr(url) + '" onclick="sendEmoji(\'' + escapeAttr(url) + '\')" />';
      }).join('');
    }

    async function sendEmoji(url) {
      await sendMessage({
        type: 'emoji',
        content: '[表情]',
        image_url: url
      });
    }

    function quoteById(id) {
      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (!msg) return;

      quoteMessage = msg;
      $('quoteText').textContent = '引用 ' + msg.sender_name + '：' + getPreview(msg);
      $('quoteBar').style.display = 'flex';
      $('messageInput').focus();
    }

    function cancelQuote() {
      quoteMessage = null;
      $('quoteText').textContent = '';
      $('quoteBar').style.display = 'none';
    }

    async function recallMessage(id) {
      const msg = messagesCache.find(function (m) {
        return m.id === id;
      });

      if (!msg) return;

      if (msg.sender_client_id !== clientId) {
        alert('只能撤回当前浏览器发送的消息');
        return;
      }

      const { error } = await client
        .from('messages')
        .update({
          recalled: true,
          content: null,
          image_url: null
        })
        .eq('id', id);

      if (error) {
        console.error(error);
        alert('撤回失败：' + error.message);
        return;
      }

      loadMessages();
    }

    function hideMessage(id) {
      const ids = getHiddenIds();

      if (!ids.includes(id)) {
        ids.push(id);
        setHiddenIds(ids);
      }

      renderMessages();
    }

    function clearLocalHidden() {
      if (!confirm('确定清空本地删除记录吗？之前删除的消息会重新显示。')) return;

      setHiddenIds([]);
      renderMessages();
    }

    function getPreview(msg) {
      if (msg.recalled) return '该消息已撤回';
      if (msg.type === 'text') return (msg.content || '').slice(0, 40);
      if (msg.type === 'image') return '[图片]';
      if (msg.type === 'emoji') return '[表情]';
      return '[消息]';
    }

    function renderMessageAvatarHtml(name, url, avatarClass) {
      if (url) {
        return '<div class="avatar ' + avatarClass + '"><img src="' + escapeAttr(url) + '" /></div>';
      }

      return '<div class="avatar ' + avatarClass + '">' + escapeHtml(getAvatarText(name)) + '</div>';
    }

    function renderAvatarBox(el, name, url) {
      if (!el) return;

      if (url) {
        el.innerHTML = '<img src="' + escapeAttr(url) + '" />';
      } else {
        el.textContent = getAvatarText(name);
      }
    }

    function getAvatarText(name) {
      if (!name) return '?';

      const clean = String(name).trim();

      if (!clean) return '?';

      const first = clean[0];
      const second = clean[1];

      if (/[\u4e00-\u9fa5]/.test(first)) {
        return first;
      }

      if (second && /^[a-zA-Z0-9]$/.test(second)) {
        return (first + second).toUpperCase();
      }

      return first.toUpperCase();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    $('messageInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    });

    if (nickname) {
      showApp();
    } else {
      showNicknamePage();
    }
  </script>
</body>
</html>
